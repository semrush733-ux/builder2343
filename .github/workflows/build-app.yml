name: App builder
run-name: "App build ${{ inputs.build_id }}"

# Builds an app for ANY website from one request. Started by the WordPress plugin
# "BWP App Builder" through the GitHub API (workflow_dispatch); can also be started by hand
# from the Actions tab.
#
# Result: a release with the tag  build-<build_id>  that contains
#   <App-Name>.ipa   unsigned iPhone app (install with a sideloading tool such as Sideloadly)
#   <App-Name>.apk   Android test app (installs directly)
# The release notes hold a small JSON status that the plugin reads.

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Unique ID of this build (8-40 lowercase letters / digits)"
        required: true
        type: string
      config:
        description: 'JSON: {"appName":"My App","homeUrl":"https://example.com/"} (optional: appId, company, brandColor, backgroundColor, loadingText, extraHosts)'
        required: true
        type: string
      logo_url:
        description: "https URL of the logo image (optional)"
        required: false
        type: string
        default: ""
      platforms:
        description: "ios, android or both"
        required: false
        type: string
        default: "ios"

permissions:
  contents: write

env:
  # Request values are only ever passed through the environment - never pasted into a script.
  BUILD_ID: ${{ inputs.build_id }}
  BUILD_CONFIG: ${{ inputs.config }}
  LOGO_URL: ${{ inputs.logo_url }}
  PLATFORMS: ${{ inputs.platforms }}
  GH_TOKEN: ${{ github.token }}

jobs:
  start:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.plan.outputs.ios }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - name: Check the request and open the release
        id: plan
        run: |
          if ! printf '%s' "$BUILD_ID" | grep -Eq '^[a-z0-9]{8,40}$'; then
            echo "Invalid build_id"; exit 1
          fi
          case "$PLATFORMS" in
            ios) echo "ios=true" >> "$GITHUB_OUTPUT"; echo "android=false" >> "$GITHUB_OUTPUT" ;;
            android) echo "ios=false" >> "$GITHUB_OUTPUT"; echo "android=true" >> "$GITHUB_OUTPUT" ;;
            both) echo "ios=true" >> "$GITHUB_OUTPUT"; echo "android=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Invalid platforms value"; exit 1 ;;
          esac
          printf '{"status":"building","run_id":"%s"}\n' "$GITHUB_RUN_ID" > notes.json
          gh release create "build-$BUILD_ID" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "App build $BUILD_ID" --notes-file notes.json --prerelease

  ios:
    needs: start
    if: needs.start.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply the requested app settings
        run: |
          node scripts/ci/apply-build-config.mjs
          node scripts/make-brand-assets.mjs

      - name: Create the Xcode project
        run: |
          npx cap add ios
          npx capacitor-assets generate --ios
          npx cap sync ios
          node scripts/configure-native.mjs

      - name: Build the unsigned IPA
        working-directory: ios/App
        run: |
          set -o pipefail
          if [ -d App.xcworkspace ]; then XC_TARGET="-workspace App.xcworkspace"; else XC_TARGET="-project App.xcodeproj"; fi
          xcodebuild $XC_TARGET -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 \
            | tee "$RUNNER_TEMP/ios-build.log" | grep -E "error:|ARCHIVE|\*\*" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/ios-build.log"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/$APP_SLUG.ipa" Payload)

      - name: Add the IPA to the release
        run: gh release upload "build-$BUILD_ID" "$RUNNER_TEMP/$APP_SLUG.ipa" --clobber

      - name: Keep the warnings
        if: always()
        run: |
          mkdir -p result
          [ -f build-warnings.txt ] && cp build-warnings.txt result/ios-warnings.txt || true
          [ -f build-error.txt ] && cp build-error.txt result/ios-error.txt || true
          if [ -f "$RUNNER_TEMP/ios-build.log" ]; then grep -E "error:" "$RUNNER_TEMP/ios-build.log" | sort -u | head -20 > result/ios-compile-errors.txt || true; fi
          echo "done" > result/ios-ran.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-ios
          path: result/

  android:
    needs: start
    if: needs.start.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Apply the requested app settings
        run: |
          node scripts/ci/apply-build-config.mjs
          node scripts/make-brand-assets.mjs

      - name: Create the Android project
        run: |
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          node scripts/configure-native.mjs
          chmod +x android/gradlew

      - name: Build the APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/android-build.log" | tail -40
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$APP_SLUG.apk"

      - name: Add the APK to the release
        run: gh release upload "build-$BUILD_ID" "$RUNNER_TEMP/$APP_SLUG.apk" --clobber

      - name: Keep the warnings
        if: always()
        run: |
          mkdir -p result
          [ -f build-warnings.txt ] && cp build-warnings.txt result/android-warnings.txt || true
          [ -f build-error.txt ] && cp build-error.txt result/android-error.txt || true
          if [ -f "$RUNNER_TEMP/android-build.log" ]; then grep -E "error:|What went wrong|FAILED" "$RUNNER_TEMP/android-build.log" | sort -u | head -20 > result/android-compile-errors.txt || true; fi
          echo "done" > result/android-ran.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-android
          path: result/

  finish:
    needs: [start, ios, android]
    if: always() && needs.start.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IOS_RESULT: ${{ needs.ios.result }}
      ANDROID_RESULT: ${{ needs.android.result }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: result-*
          merge-multiple: true
          path: result

      - name: Write the final status into the release
        run: |
          mkdir -p result
          python3 - <<'PY'
          import glob, json, os
          def read(pattern, limit=10):
              lines = []
              for name in sorted(glob.glob(pattern)):
                  with open(name, encoding='utf-8', errors='replace') as f:
                      lines += [l.strip()[:300] for l in f if l.strip()]
              return list(dict.fromkeys(lines))[:limit]
          status = {
              'status': 'done',
              'run_id': os.environ.get('GITHUB_RUN_ID', ''),
              'ios': os.environ.get('IOS_RESULT', 'skipped'),
              'android': os.environ.get('ANDROID_RESULT', 'skipped'),
              'warnings': read('result/*-warnings.txt'),
              'errors': read('result/*-error.txt') + read('result/*-compile-errors.txt', 6),
          }
          with open('notes.json', 'w', encoding='utf-8') as f:
              json.dump(status, f, ensure_ascii=False)
          print(json.dumps(status, indent=2, ensure_ascii=False))
          PY
          gh release edit "build-$BUILD_ID" --repo "$GITHUB_REPOSITORY" --notes-file notes.json

      # Finished builds are kept for 7 days, then removed together with their tags.
      - name: Remove old builds
        continue-on-error: true
        run: |
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name | startswith(\"build-\")) | select(.created_at < \"$CUTOFF\") | .tag_name" \
            | head -50 | while read -r TAG; do
                gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
              done
