name: Android build (APK + AAB)

# Builds the Android app on a GitHub-hosted machine.
#
# Always produced : app-debug.apk (installable for testing) and unsigned release APK / AAB
# With secrets    : signed app-release.apk and app-release.aab (Google Play)
#
# Secrets for the signed build (repository > Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    your .jks file encoded as base64 (one line)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias (for example bwp-billing)
#   ANDROID_KEY_PASSWORD       key password

on:
  push:
    branches: [main, bwp-billing-app]
    paths-ignore: ['**.md', 'docs/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create and configure the Android project
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android
          npx cap sync android
          node scripts/configure-native.mjs
          chmod +x android/gradlew
          cat android/variables.gradle

      - name: Add the release keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/out/logs"
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/out/logs/debug-build.log"

      - name: Build release APK and AAB
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/out/logs/release-build.log"

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p out
          find android/app/build/outputs -name "*.apk" -exec cp {} out/ \; 2>/dev/null || true
          find android/app/build/outputs -name "*.aab" -exec cp {} out/ \; 2>/dev/null || true
          rm -f android/release.jks android/keystore.properties
          if [ -d android ]; then zip -qry out/android-studio-project.zip android -x "android/.gradle/*" "android/build/*" "android/app/build/*" "android/local.properties"; fi
          ls -la out

      - name: Verify the APK and write the build report
        if: always()
        run: |
          R=out/REPORT-android.md
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=out/app-debug.apk
          {
            echo "## Android build #$BUILD_NUMBER"
            echo ""
            echo "Commit: \`$GITHUB_SHA\`"
            echo ""
            echo '```'
            echo "release signing secrets present: $HAS_SIGNING"
            for f in out/*.apk out/*.aab; do if [ -f "$f" ]; then echo "$(basename "$f")  $(stat -c%s "$f") bytes  sha256 $(sha256sum "$f" | cut -d' ' -f1)"; fi; done
            echo '```'
          } > "$R"
          if [ -f "$APK" ]; then
            {
              echo "### app-debug.apk"
              echo '```'
              "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^minSdkVersion|^application-label:|^uses-permission|^launchable-activity" || true
              echo "--- signature"
              "$BT/apksigner" verify --print-certs "$APK" 2>&1 | head -3 || true
              echo "--- web assets"
              unzip -l "$APK" | grep -E "assets/(public/|capacitor)" | awk '{print $4}' || true
              echo "--- classes of the BWP plugin in dex: $(unzip -p "$APK" 'classes*.dex' | strings | grep -c 'com/bwpexperts/billing/nativeplugin' || true)"
              echo "--- launcher icons: $(unzip -l "$APK" | grep -c 'ic_launcher' || true)"
              echo '```'
              echo "### Manifest checks"
              echo '```'
              "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" > "$RUNNER_TEMP/manifest.txt" || true
              grep -E "allowBackup|networkSecurityConfig|usesCleartextTraffic|android:host|autoVerify|bwpfiles|windowSoftInputMode" "$RUNNER_TEMP/manifest.txt" | sed 's/^ *//' || true
              echo '```'
              echo "### capacitor.plugins.json"
              echo '```json'
              unzip -p "$APK" assets/capacitor.plugins.json || true
              echo ""
              echo '```'
              echo "### capacitor.config.json (inside the app)"
              echo '```json'
              unzip -p "$APK" assets/capacitor.config.json || true
              echo ""
              echo '```'
            } >> "$R"
          fi
          {
            echo "### SDK levels (android/variables.gradle)"
            echo '```'
            grep -E "SdkVersion" android/variables.gradle || true
            echo '```'
            echo "### Compiler messages for the BWP plugin"
            echo '```'
            grep -hE "nativeplugin/[A-Za-z]+\.java:[0-9]+: (warning|error)|uses or overrides a deprecated|unchecked" out/logs/*.log 2>/dev/null | sed -E 's#^.*/nativeplugin/##' | sort -u | head -40 || true
            echo "(end)"
            echo '```'
            echo "### Errors"
            echo '```'
            grep -hE "^e: |error:|FAILED|What went wrong" out/logs/*.log 2>/dev/null | sort -u | head -40 || true
            echo "(end)"
            echo '```'
          } >> "$R"
          cat "$R"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bwp-billing-android
          path: out/
          if-no-files-found: warn

      # Direct download links: https://github.com/<owner>/<repo>/releases/tag/android-latest
      - name: Publish to the "android-latest" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag --yes 2>/dev/null || true
          sleep 3
          FILES=$(ls out/*.apk out/*.aab out/android-studio-project.zip 2>/dev/null || true)
          gh release create android-latest $FILES --target "$GITHUB_SHA" \
            --title "BWP Billing - Android build #$BUILD_NUMBER" --notes-file out/REPORT-android.md --prerelease

  # Starts the debug APK on an emulator and drives it: launch, site load, download dialog, print,
  # share, Back button, pull-to-refresh, keyboard, offline / reconnect. Never logs in.
  smoke:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bwp-billing-android
          path: out

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install websocket-client

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        continue-on-error: true
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -memory 4096
          script: python3 scripts/ci/android_smoke.py

      - name: Add the smoke test result to the release notes
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f out/smoke/SMOKE-android.md ] || { mkdir -p out/smoke; printf '### Emulator smoke test (Android)\n\nThe emulator test did not produce a result.\n' > out/smoke/SMOKE-android.md; }
          gh release view android-latest --json body -q .body > "$RUNNER_TEMP/body.md"
          { echo ""; cat out/smoke/SMOKE-android.md; } >> "$RUNNER_TEMP/body.md"
          gh release edit android-latest --notes-file "$RUNNER_TEMP/body.md"

      # Screenshots of the smoke test go to the "ci-smoke-android" branch (replaced on every build).
      - name: Publish smoke test screenshots
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls out/smoke/*.png >/dev/null 2>&1 || exit 0
          D="$RUNNER_TEMP/smoke-branch"; rm -rf "$D"; mkdir -p "$D"
          cp out/smoke/*.png out/smoke/*.md "$D"/
          { grep -E "Capacitor/Console|BwpNative|FATAL|AndroidRuntime" out/smoke/logcat.txt | cut -c1-400 | tail -300; echo "-----"; grep -E " [EWF] " out/smoke/logcat.txt | tail -200; } > "$D/logcat-filtered.txt" 2>/dev/null || true
          cd "$D"
          git init -q && git checkout -q -b ci-smoke-android && git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Android smoke test output (build $BUILD_NUMBER)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-smoke-android
