<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Block Merge 2048 — League</title>
<style>
@font-face{font-family:Fredoka;font-weight:500;font-display:swap;src:url(fonts/fredoka-500.woff2) format("woff2")}
@font-face{font-family:Fredoka;font-weight:600;font-display:swap;src:url(fonts/fredoka-600.woff2) format("woff2")}
@font-face{font-family:Fredoka;font-weight:700;font-display:swap;src:url(fonts/fredoka-700.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0d1024;color:#fff;font-family:Fredoka,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{max-width:440px;margin:0 auto;position:absolute;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);overflow:hidden;background:var(--appbg,#0d1024);transition:background .4s}
.bgdeco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bgdeco i{position:absolute;bottom:-60px;border-radius:12px;opacity:.10;animation:floatUp linear infinite}
@keyframes floatUp{to{transform:translateY(-120vh) rotate(360deg)}}
.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:1}
.screen.active{display:flex}
.ic{display:inline-block;vertical-align:middle;flex-shrink:0}
button{font-family:inherit}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:700;font-size:18px;color:#fff;background:linear-gradient(180deg,#6b76ff,#4f5bd5);box-shadow:0 5px 0 #343c9c,0 8px 16px #0005;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:.3px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #343c9c}
.btn.green{background:linear-gradient(180deg,#4fe08f,#2fbf71);box-shadow:0 5px 0 #1f8a50,0 8px 16px #0005}
.btn.gold{background:linear-gradient(180deg,#ffd86b,#f2b632);color:#4a3000;box-shadow:0 5px 0 #b9851a,0 8px 16px #0005}
.btn.red{background:linear-gradient(180deg,#ff7b93,#e8395c);box-shadow:0 5px 0 #a8193a,0 8px 16px #0005}
.btn.ghost{background:#ffffff14;box-shadow:none}
.btn.big{font-size:24px;padding:16px}
.btn.sm{font-size:14px;padding:8px 12px;border-radius:12px;box-shadow:0 3px 0 #343c9c;width:auto}
.btn.sm.green{box-shadow:0 3px 0 #1f8a50}.btn.sm.gold{box-shadow:0 3px 0 #b9851a}
.btn:disabled{opacity:.45;filter:grayscale(.6);pointer-events:none}
.dot{position:absolute;top:4px;right:8px;width:12px;height:12px;border-radius:50%;background:#ff4f6b;border:2px solid #1a1d4a;display:none;animation:pulse 1.2s infinite}
.dot.on{display:block}
@keyframes pulse{50%{transform:scale(1.25)}}
/* HOME */
#home{padding:12px 18px 18px;gap:10px}
.home-top{display:flex;align-items:center;gap:8px;font-weight:700}
.pill{background:#0006;border:1px solid #ffffff1a;border-radius:20px;padding:3px 12px 3px 5px;display:flex;align-items:center;gap:6px;font-size:16px}
.home-top .grow{flex:1}
.iconbtn{background:#0006;border:1px solid #ffffff1a;color:#fff;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.logo{text-align:center;margin:2px 0 0}
.logo-blocks{display:flex;justify-content:center;gap:8px;margin-bottom:8px;height:54px}
.logo-blocks .blk{position:relative;transform:none;animation:bob 2.2s ease-in-out infinite}
.logo-blocks .blk:nth-child(2){animation-delay:.25s}.logo-blocks .blk:nth-child(3){animation-delay:.5s}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.logo h1{font-size:36px;font-weight:700;letter-spacing:.5px;line-height:1.05;background:linear-gradient(180deg,#fff,#c9ceff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #0006)}
.logo p{color:#ffd86b;font-weight:700;letter-spacing:5px;font-size:12px}
@media (max-height:700px){.logo-blocks{display:none}.logo h1{font-size:30px}}
.tier-card{background:linear-gradient(135deg,#ffffff1f,#ffffff08);border:1px solid #ffffff26;border-radius:20px;padding:10px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.tier-card .tn{font-weight:700;font-size:19px}
.tier-card .ts{color:#b8bde8;font-size:13px;margin-top:2px;display:flex;align-items:center;gap:4px}
.tier-card .tr{margin-left:auto;text-align:right}
.tier-card .tr b{font-size:24px;display:block;color:#ffd86b}
.tier-card .tr small{color:#b8bde8;font-size:11px}
.chal{background:linear-gradient(135deg,#ff8a5c33,#c45cf233);border:1px solid #ffffff26;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.chal .ct{flex:1;min-width:0}
.chal small{font-size:10px;letter-spacing:1px;color:#ffd86b;font-weight:700}
.chal b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;border-radius:5px;background:#0006;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#4fe08f,#9cf5c0);width:0;transition:width .4s}
.quick{display:flex;gap:8px}
.qt{flex:1;position:relative;background:#ffffff10;border:1px solid #ffffff18;border-radius:16px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#dfe2ff;cursor:pointer}
.qt:active{transform:scale(.94)}
.spacer{flex:1}
/* GAME */
#game{padding:10px 12px 12px}
.gtop{display:flex;gap:8px;align-items:stretch}
.icon{background:#ffffff14;border:0;color:#fff;border-radius:14px;width:48px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sc{flex:1;background:#0005;border:1px solid #ffffff14;border-radius:14px;padding:5px 6px;text-align:center;min-width:0}
.sc small{display:block;font-size:10px;color:#b8bde8;font-weight:600;letter-spacing:1px;white-space:nowrap}
.sc b{font-size:19px;display:inline-block}
.sc.rank{background:linear-gradient(180deg,#ffd86b2a,#ffd86b10);cursor:pointer}
.sc.rank b{color:#ffd86b}
.sc small .ic{margin-top:-2px}
.nextbar{display:flex;justify-content:center;align-items:flex-end;gap:18px;margin:8px 0 4px;height:80px;position:relative}
.nextbar small{display:block;text-align:center;font-size:11px;color:#b8bde8;font-weight:600;letter-spacing:1px;margin-bottom:4px}
.pvslot{position:relative;display:flex;justify-content:center}
.pvslot .blk{position:relative}
#modeTag{position:absolute;left:0;bottom:6px;font-size:11px;font-weight:700;letter-spacing:1px;color:#b8bde8;background:#0005;border-radius:10px;padding:4px 8px;display:flex;align-items:center;gap:4px}
#timer{height:12px;border-radius:8px;background:#0006;overflow:hidden;margin:0 auto 6px;display:none;position:relative}
#timer i{display:block;height:100%;background:linear-gradient(90deg,#ff5f7e,#ffd86b,#4fe08f);background-size:var(--tw,300px) 100%;width:100%}
#timer span{position:absolute;inset:0;text-align:center;font-size:10px;line-height:12px;font-weight:700;text-shadow:0 1px 2px #000}
#stage{position:relative;margin:0 auto}
#boardWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:2px}
#board{position:relative;border-radius:18px;overflow:hidden;touch-action:none;cursor:pointer;background:var(--board,#171b3d);box-shadow:inset 0 0 0 2px #ffffff26,0 10px 30px #0008}
#cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr)}
#cols div{border-right:1px solid #ffffff09;background-image:linear-gradient(#ffffff07 1px,transparent 1px);background-size:100% var(--cell);transition:background-color .15s}
#cols div:last-child{border-right:0}
#cols div.hl{background-color:#ffffff0e}
#flash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:4}
#fx{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:visible}
.dropghost{position:absolute;left:0;top:0;width:calc(var(--cell) - 8px);height:calc(var(--cell) - 8px);border-radius:24%;border:3px dashed #ffffff55;transition:transform .12s;pointer-events:none;z-index:1}
#tut{position:absolute;inset:0;z-index:40;pointer-events:none;display:none}
#tut .tap{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 20px #fff;animation:tap 1.1s infinite}
@keyframes tap{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.4);opacity:0}}
#tut .arrow{position:absolute;margin-left:-20px;animation:arw .8s ease-in-out infinite;color:#fff;filter:drop-shadow(0 2px 4px #000)}
@keyframes arw{50%{transform:translateY(10px)}}
#tut .bubble{position:absolute;left:8px;right:8px;top:10px;background:#fff;color:#1a1d4a;border-radius:16px;padding:10px 12px;font-weight:600;font-size:15px;text-align:center;box-shadow:0 6px 20px #0008;pointer-events:auto}
#tut .bubble .btn{margin-top:8px;font-size:15px;padding:9px}
/* BLOCKS */
.blk{position:absolute;left:0;top:0;width:calc(var(--cell) - 6px);height:calc(var(--cell) - 6px);transition:transform .16s cubic-bezier(.5,0,.75,0),opacity .15s;pointer-events:none;z-index:2}
.blk .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.blk .rays{position:absolute;inset:-28%;border-radius:50%;background:repeating-conic-gradient(var(--c1) 0 10deg,transparent 10deg 30deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);opacity:.55;animation:spin 6s linear infinite;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.blk .face{position:absolute;inset:0;border-radius:24%;overflow:hidden;
  background:radial-gradient(circle at 30% 22%,#ffffffa0,transparent 42%),linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:inset 0 -6px 0 #0000002e,inset 0 0 0 2px #ffffff40,0 4px 10px #0006}
.blk .face::after{content:"";position:absolute;left:12%;right:12%;top:7%;height:26%;border-radius:40% 40% 50% 50%;background:linear-gradient(#ffffff70,#ffffff00)}
.blk .face::before{content:"";position:absolute;inset:0;border-radius:inherit}
.blk .ring{position:absolute;inset:14%;border-radius:30%;border:2px solid #ffffff55;display:none}
.blk .num{position:relative;font-weight:700;color:#fff;font-size:calc(var(--cell) * .44);line-height:1;text-shadow:0 3px 0 #00000045;-webkit-text-stroke:1.5px #0000002a;paint-order:stroke fill;z-index:2;display:flex;align-items:center;justify-content:center}
.blk .num svg{width:calc(var(--cell) * .62);height:calc(var(--cell) * .62);filter:drop-shadow(0 2px 2px #0006)}
.blk.d3 .num{font-size:calc(var(--cell) * .34)}
.blk.d4 .num{font-size:calc(var(--cell) * .28)}
.blk .flash{position:absolute;inset:0;border-radius:24%;background:#fff;opacity:0;z-index:3}
.blk .crown{position:absolute;top:-30%;left:50%;width:56%;margin-left:-28%;z-index:3;display:none;filter:drop-shadow(0 2px 2px #0006)}
.blk.s2 .face{border-radius:34%}.blk.s2 .ring{display:block}
.blk.s3 .face{border-radius:10%;clip-path:polygon(22% 0,78% 0,100% 22%,100% 78%,78% 100%,22% 100%,0 78%,0 22%)}
.blk.s3 .ring{display:block;border-radius:6%;inset:12%;clip-path:polygon(22% 0,78% 0,100% 22%,100% 78%,78% 100%,22% 100%,0 78%,0 22%);border-width:3px}
.blk.s3 .rays{display:block;opacity:.35}
.blk.s4 .face{border-radius:50%;box-shadow:inset 0 -6px 0 #0000002e,inset 0 0 0 3px #ffffff66,0 0 18px var(--c1),0 4px 10px #0006;animation:glow 1.6s ease-in-out infinite}
.blk.s4 .rays{display:block}.blk.s4 .ring{display:block;border-radius:50%;border-style:dashed;animation:spin 8s linear infinite}
.blk.s4 .flash{border-radius:50%}
@keyframes glow{50%{box-shadow:inset 0 -6px 0 #0000002e,inset 0 0 0 3px #ffffff99,0 0 30px var(--c1),0 4px 10px #0006}}
.blk.rainbow .face{background:radial-gradient(circle at 30% 22%,#ffffffa0,transparent 42%),linear-gradient(120deg,#ff5fa2,#ffd86b,#5fffb0,#6fd6ff,#b37bff,#ff5fa2);background-size:100% 100%,300% 300%;animation:rb 3s linear infinite,glow 1.6s ease-in-out infinite}
.blk.rainbow .crown{display:block}
@keyframes rb{to{background-position:0 0,300% 0}}
/* skins */
.k-candy .face::before{background:repeating-linear-gradient(135deg,#ffffff38 0 7px,transparent 7px 14px)}
.k-candy .num{-webkit-text-stroke:5px var(--c2);text-shadow:0 3px 0 #0003}
.k-ocean .face::before{background:radial-gradient(circle at 75% 70%,#ffffff55 0 4%,transparent 5%),radial-gradient(circle at 62% 84%,#ffffff44 0 3%,transparent 4%),radial-gradient(circle at 84% 52%,#ffffff40 0 2.5%,transparent 3.5%)}
.k-neon .face{background:#12122a!important;box-shadow:inset 0 0 0 3px var(--c1),inset 0 0 16px color-mix(in srgb,var(--c1) 55%,transparent),0 0 14px color-mix(in srgb,var(--c1) 60%,transparent)!important}
.k-neon .face::after{display:none}
.k-neon .num{color:var(--c1);text-shadow:0 0 10px var(--c1);-webkit-text-stroke:0}
.k-neon .ring{border-color:color-mix(in srgb,var(--c1) 60%,transparent)}
.k-gold .face{background:radial-gradient(circle at 30% 22%,#ffffffb0,transparent 42%),linear-gradient(160deg,#fff1a8,#f2b632 55%,#c27c00)!important}
.k-gold .ring{display:block;border:3px solid var(--c2)}
.k-gold .num{color:#6b4300;text-shadow:0 2px 0 #fff9;-webkit-text-stroke:0}
.k-gems .face::before{background:linear-gradient(135deg,#ffffff50 0 22%,transparent 22% 50%,#0000001f 50% 78%,transparent 78%),linear-gradient(45deg,transparent 0 60%,#ffffff26 60% 70%,transparent 70%)}
/* specials */
.sp-bomb .face{background:radial-gradient(circle at 32% 26%,#9a9ab8,#33334a 55%,#15151f)!important;animation:bombpulse .7s ease-in-out infinite}
@keyframes bombpulse{50%{box-shadow:inset 0 -6px 0 #0000002e,0 0 18px #ff7b3c,0 4px 10px #0006}}
.sp-rainbow .face{background:radial-gradient(circle at 30% 22%,#ffffffa0,transparent 42%),conic-gradient(#ff5f7e,#ffd86b,#7ef0a6,#6fd6ff,#b37bff,#ff5f7e)!important;animation:spin 3s linear infinite}
.sp-bomb .ring,.sp-rainbow .ring,.sp-bomb .rays,.sp-rainbow .rays{display:none!important}
#board.hammer .blk .in{animation:wob .35s infinite}
#board.hammer{box-shadow:inset 0 0 0 3px #ff5f7e,0 10px 30px #0008}
@keyframes wob{25%{rotate:-5deg}75%{rotate:5deg}}
/* FX */
.fx{position:absolute;left:0;top:0;pointer-events:none;will-change:transform,opacity}
.fx svg{width:100%;height:100%;display:block}
.shard{border-radius:3px}
.wave{border-radius:50%}
.fpts{font-weight:700;font-size:20px;color:#fff;text-shadow:0 2px 0 #0008,0 0 10px #000a;white-space:nowrap}
.popup{display:flex;align-items:center;justify-content:center}
.popup svg{position:absolute;width:100%;height:100%;animation:spin 4s linear infinite}
.popup span{position:relative;font-weight:700;font-size:30px;letter-spacing:1px;color:#fff;-webkit-text-stroke:5px #5a1fb0;paint-order:stroke fill;text-shadow:0 4px 0 #2d0f63;white-space:nowrap}
.popup.big span{font-size:38px}
.pbar{display:flex;gap:10px;justify-content:center;margin-top:8px}
.pw{background:linear-gradient(180deg,#ffffff1f,#ffffff0a);border:1px solid #ffffff1f;color:#fff;border-radius:16px;padding:7px 12px;cursor:pointer;position:relative;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.pw .cnt{position:absolute;top:-8px;right:-8px;background:linear-gradient(#ff7b93,#e8395c);border-radius:10px;font-size:12px;font-weight:700;padding:1px 7px;border:2px solid #1a1d4a}
.pw.on{background:#ff5f7e44;box-shadow:0 0 0 2px #ff5f7e}
/* LEAGUE */
#league{padding:0}
.lhead{padding:12px 14px 10px;background:linear-gradient(180deg,#2e3480ee,#1a1e4cee);border-bottom:1px solid #ffffff14}
.lrow1{display:flex;align-items:center;gap:10px}
.lrow1 h2{font-size:21px;font-weight:700;flex:1;display:flex;align-items:center;gap:8px}
#lTimer{font-size:12px;background:#0005;border-radius:10px;padding:5px 9px;font-weight:600;display:flex;align-items:center;gap:4px}
.ladder{display:flex;justify-content:space-between;margin:12px 4px 10px}
.ladder div{text-align:center;opacity:.35;flex:1;transition:.2s}
.ladder div small{display:block;font-size:10px;font-weight:600}
.ladder div.cur{opacity:1;transform:scale(1.18)}
.leader{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#ffe07a,#f5a524);color:#3a2300;border-radius:18px;padding:10px 14px;box-shadow:0 0 26px #f5c54266;position:relative;overflow:hidden}
.leader::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(90deg,transparent,#ffffff80,transparent);transform:skewX(-20deg);animation:shine 2.8s infinite}
@keyframes shine{60%,100%{left:130%}}
.leader b{font-size:18px;display:block}
.leader small{font-weight:700;font-size:11px;letter-spacing:1px}
.leader .lp{margin-left:auto;font-weight:700;font-size:19px}
.linfo{font-size:11px;color:#b8bde8;text-align:center;margin-top:8px}
#lList{flex:1;overflow-y:auto;padding:6px 10px 84px}
.row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;margin-bottom:4px;background:#ffffff08}
.row.promo{background:#2fbf7117}
.row.demo{background:#ff5f7e17}
.row.me{background:linear-gradient(90deg,#6b76ff,#4f5bd5);box-shadow:0 0 0 2px #a5acff}
.row .rk{width:30px;text-align:center;font-weight:700;color:#b8bde8;font-size:14px;display:flex;justify-content:center}
.row.me .rk{color:#fff}
.row .av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;box-shadow:inset 0 -3px 0 #0003}
.row .nm{flex:1;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pt{font-weight:700;font-size:15px}
.zline{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;padding:6px;margin:6px 0;border-radius:8px;letter-spacing:1px}
.zline.up{color:#4fe08f;border:1px dashed #4fe08f}
.zline.down{color:#ff5f7e;border:1px dashed #ff5f7e}
.mebar{position:absolute;left:10px;right:10px;bottom:10px;background:linear-gradient(90deg,#6b76ff,#4f5bd5);border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px #0008;font-weight:700;font-size:15px}
.mebar .gap{margin-left:auto;font-size:12px;color:#e3e6ff;text-align:right;font-weight:500}
.dev{background:none;border:1px dashed #ffffff44;color:#b8bde8;border-radius:10px;padding:6px 10px;font-size:12px;margin:10px auto 0;display:flex;align-items:center;gap:6px;cursor:pointer}
/* PANEL (shop / missions / stats) */
#panel{padding:0}
.phead{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#0004;border-bottom:1px solid #ffffff14}
.phead h2{flex:1;font-size:21px;display:flex;align-items:center;gap:8px}
#pBody{flex:1;overflow-y:auto;padding:12px 12px 24px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;background:#ffffff10;border:1px solid #ffffff18;color:#cfd3f5;border-radius:12px;padding:9px;font-weight:700;font-size:15px;cursor:pointer}
.tab.on{background:#6b76ff;color:#fff;border-color:#a5acff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{background:#ffffff0d;border:1px solid #ffffff18;border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px}
.item.sel{border-color:#4fe08f;box-shadow:0 0 0 2px #4fe08f inset}
.item b{font-size:16px}
.skinprev{display:grid;grid-template-columns:1fr 1fr;gap:4px;--cell:42px;padding:4px}
.skinprev .blk{position:relative;transform:none}
.themeprev{width:100%;height:90px;border-radius:12px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px #ffffff22}
.themeprev i{position:absolute;left:22%;right:22%;top:18%;bottom:0;border-radius:10px 10px 0 0;box-shadow:inset 0 0 0 1px #ffffff26}
.mrow{display:flex;align-items:center;gap:10px;background:#ffffff0b;border:1px solid #ffffff14;border-radius:16px;padding:10px 12px;margin-bottom:8px}
.mrow .mt{flex:1;min-width:0}
.mrow b{font-size:15px;display:block}
.mrow small{color:#b8bde8;font-size:12px;display:flex;align-items:center;gap:4px}
.mrow.done{opacity:.5}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat2 div{background:#ffffff0d;border:1px solid #ffffff14;border-radius:16px;padding:12px;text-align:center}
.stat2 small{display:block;color:#b8bde8;font-size:11px;letter-spacing:1px;font-weight:600}
.stat2 b{font-size:22px}
/* MODAL */
.modal{position:fixed;inset:0;background:#05061acc;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px;backdrop-filter:blur(3px)}
.modal.hidden{display:none}
.card{background:linear-gradient(180deg,#262b6b,#1a1d4c);border:1px solid #ffffff26;border-radius:24px;padding:20px 18px;width:100%;max-width:370px;text-align:center;animation:pin .35s cubic-bezier(.3,1.5,.5,1);box-shadow:0 20px 50px #000a;max-height:100%;overflow-y:auto}
@keyframes pin{from{transform:scale(.6);opacity:0}}
.card h2{font-size:25px;font-weight:700;margin-bottom:6px}
.card p{color:#cfd3f5;margin:6px 0;line-height:1.45;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.card ul{text-align:left;color:#cfd3f5;font-size:14px;line-height:1.5;padding-left:18px;margin:8px 0}
.card ul li{margin-bottom:4px}
.card input{width:100%;padding:13px;border-radius:12px;border:2px solid #6b76ff;background:#0d1024;color:#fff;font-size:17px;margin:10px 0 4px;font-family:inherit;user-select:text;-webkit-user-select:text}
.mbtns{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.mbtns.row2{flex-direction:row}
.go-score{font-size:50px;font-weight:700;color:#ffd86b;margin:0;text-shadow:0 4px 0 #0006}
.go-league{background:#0004;border-radius:14px;padding:10px;margin-top:10px;font-size:15px;line-height:1.7}
.hero{margin:-4px auto 6px;display:block}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.day{background:#ffffff10;border:1px solid #ffffff1a;border-radius:14px;padding:8px 2px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.day.big{grid-column:span 2}
.day.got{opacity:.45}
.day.today{background:linear-gradient(180deg,#ffd86b44,#ffd86b14);border-color:#ffd86b;box-shadow:0 0 14px #ffd86b55}
.day .ck{position:absolute;top:4px;right:4px;color:#4fe08f}
.wheelwrap{position:relative;width:270px;height:270px;margin:6px auto 4px}
#wheel{width:100%;height:100%;transition:transform 4.2s cubic-bezier(.12,.6,.1,1)}
.wheelptr{position:absolute;left:50%;top:-8px;margin-left:-16px;z-index:2;filter:drop-shadow(0 3px 3px #0008)}
.togs{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.tog{display:flex;align-items:center;gap:10px;background:#ffffff0d;border-radius:14px;padding:10px 12px;font-weight:600;cursor:pointer;text-align:left}
.tog span{flex:1}
.sw{width:50px;height:28px;border-radius:14px;background:#ffffff26;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px #0006}
.tog.on .sw{background:#4fe08f}.tog.on .sw::after{left:25px}
.modes{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.mode{display:flex;align-items:center;gap:12px;background:#ffffff10;border:1px solid #ffffff22;border-radius:18px;padding:12px;cursor:pointer;text-align:left}
.mode:active{transform:scale(.97)}
.mode b{font-size:18px;display:block}
.mode small{color:#b8bde8;font-size:13px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);background:#000c;color:#fff;font-weight:600;padding:10px 16px;border-radius:14px;z-index:200;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;display:flex;align-items:center;gap:6px}
#toast.on{opacity:1}
.rew{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:10px 0}
.rew div{display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:18px;gap:2px}
</style>
</head>

const Snd={
  ctx:null,out:null,
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    this.ctx=new AC();this.out=this.ctx.createGain();this.out.gain.value=.55;this.out.connect(this.ctx.destination);
    const len=this.ctx.sampleRate;this.nb=this.ctx.createBuffer(1,len,this.ctx.sampleRate);const d=this.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    Music.setup();
  },
  ok(){return this.ctx&&profile.settings.sound},
  tone(f,d,type='sine',vol=.3,when=0,slide){
    if(!this.ok())return;const c=this.ctx,t=c.currentTime+when;
    const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(this.out);o.start(t);o.stop(t+d+.05);
  },
  noise(d,vol=.3,freq=1200,when=0,toFreq){
    if(!this.ok())return;const c=this.ctx,t=c.currentTime+when;
    const s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(freq,t);if(toFreq)f.frequency.exponentialRampToValueAtTime(toFreq,t+d);
    const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(this.out);s.start(t);s.stop(t+d+.05);
  },
  note:i=>261.63*Math.pow(2,[0,2,4,7,9][((i%5)+5)%5]/12+Math.floor(i/5)),
  click(){this.tone(700,.05,'square',.05)},
  drop(){this.tone(320,.12,'triangle',.18,0,160)},
  land(){this.noise(.06,.18,900);this.tone(110,.09,'sine',.3)},
  merge(level,chain){const n=this.note(level+chain*2);this.tone(n,.22,'triangle',.28);this.tone(n*2,.14,'sine',.1,.02);this.tone(n*1.5,.12,'sine',.06,.05)},
  combo(chain){for(let i=0;i<Math.min(chain,6);i++)this.tone(this.note(8+i*2),.12,'square',.07,i*.05)},

const Music={
  g:null,timer:null,step:0,next:0,ducked:false,
  setup(){if(!Snd.ctx||this.g)return;this.g=Snd.ctx.createGain();this.g.gain.value=0;this.g.connect(Snd.ctx.destination);this.apply()},
  vol(){return profile.settings.music&&!this.ducked&&!document.hidden?.11:0},
  apply(){
    if(!this.g)return;const t=Snd.ctx.currentTime;this.g.gain.cancelScheduledValues(t);this.g.gain.linearRampToValueAtTime(this.vol(),t+.4);
    if(this.vol()>0&&!this.timer){this.next=Snd.ctx.currentTime+.1;this.timer=setInterval(()=>this.sched(),60)}
    if(this.vol()===0&&this.timer){setTimeout(()=>{if(this.vol()===0&&this.timer){clearInterval(this.timer);this.timer=null}},500)}
  },

  sched(){
    const c=Snd.ctx,spb=60/100/2;
    const prog=[[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,17]];
    while(this.next<c.currentTime+.25){
      const bar=Math.floor(this.step/8)%4,ch=prog[bar],s=this.step%8,t=this.next;
      const pat=[0,2,1,3,2,1,3,2];
      const f=261.63/2*Math.pow(2,ch[pat[s]]/12)*2;

      if(s===0||s===4)this.voice(261.63/4*Math.pow(2,ch[0]/12),t,spb*3.5,'sine',.35);
      if(s===6&&bar===3)this.voice(f*2,t,spb,'sine',.08);
      this.step++;this.next+=spb;
    }
  },
  voice(f,t,d,type,vol){const c=Snd.ctx,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(this.g);o.start(t);o.stop(t+d+.05)}
};

const now=()=>Date.now()+store.get('devOffset',0)*7*DAY;
function weekStart(t){const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function weekId(t){const d=new Date(weekStart(t));return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
const frac=()=>Math.min(1,Math.max(0,(now()-weekStart(now()))/(7*DAY)));
function timeLeft(){let ms=weekStart(now())+7*DAY-now();const d=Math.floor(ms/DAY);ms-=d*DAY;const h=Math.floor(ms/36e5);ms-=h*36e5;const m=Math.floor(ms/6e4);return (d?d+'d ':'')+h+'h '+m+'m'}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const FN=['Ali','Sara','Hamza','Ayesha','Bilal','Zain','Fatima','Usman','Hira','Omar','Noor','Danish','Mahnoor','Saad','Iqra','John','Emma','Liam','Mia','Raj','Priya','Ahmed','Zara','Leo','Kai','Yusuf','Amna','Faizan','Rida','Taha','Hassan','Maria','Adeel','Sana','Jack','Lucas','Nadia','Imran','Kiran','Tom'];
const SF=['_Khan','99','PK','_Pro','007','X','_Gamer','_UK','786','_King','_Queen','21','_YT','Boss','','_Ace','.Max','_Star'];
const botCache={};
function makeBots(seed,tier){
  const k=seed+'_'+tier; if(botCache[k])return botCache[k];
  const r=mulberry32(seed), base=[5000,9000,15000,24000,36000][tier], used=new Set(), out=[];
  while(out.length<GROUP-1){
    let n=FN[Math.floor(r()*FN.length)]+SF[Math.floor(r()*SF.length)];
    if(used.has(n))n+=Math.floor(r()*90+10);
    if(used.has(n))continue; used.add(n);
    const a=r();
    const target=a<0.12?Math.round(base*0.08*r()):Math.round(base*(0.2+Math.pow(r(),1.7)*2.6));
    out.push({name:n,target,speed:0.55+r()*1.1,hue:Math.floor(r()*360)});
  }
  return botCache[k]=out;
}
function standings(lg,f){
  const arr=makeBots(lg.seed,lg.tier).map(b=>({name:b.name,hue:b.hue,pts:f>=1?b.target:Math.round(b.target*Math.pow(f,b.speed))}));
  arr.push({name:profile.name||'You',hue:235,pts:lg.points,me:true});
  arr.sort((a,b)=>b.pts-a.pts||(a.me?-1:b.me?1:0));
  return arr;
}

function checkWeek(){
  const id=weekId(now());
  league=store.get('league',null);
  if(!league){league=newLeague(id,0);saveLeague();return}
  if(league.week===id)return;
  const st=standings(league,1), rank=st.findIndex(x=>x.me)+1;
  let tier=league.tier, move=0;
  if(rank<=PROMO&&tier<TIERS.length-1){tier++;move=1}
  else if(rank>GROUP-DEMO&&tier>0){tier--;move=-1}
  const reward=rank===1?500:rank===2?300:rank===3?200:rank<=PROMO?100:0;
  profile.coins+=reward; if(rank===1)profile.crowns++; profile.tierMax=Math.max(profile.tierMax,tier); saveProfile();
  pendingResult={rank,move,tier,reward,leader:st[0]};
  league=newLeague(id,tier); saveLeague();
}

function curChallenge(){
  const d=today();
  if(profile.challenge.date!==d){
    let h=0;for(const ch of d)h=(h*31+ch.charCodeAt(0))>>>0;
    profile.challenge={date:d,idx:h%CHALLENGES.length,prog:0,claimed:false};saveProfile();
  }
  return CHALLENGES[profile.challenge.idx];
}
function track(ev,val){
  const ch=curChallenge(), pc=profile.challenge;
  if(pc.claimed||ch.ev!==ev)return;
  const before=pc.prog;
  if(ev==='block'||ev==='combo'){if(val>=ch.p)pc.prog=1}
  else if(ev==='gamescore'||ev==='timescore'){pc.prog=Math.max(pc.prog,val)}
  else pc.prog+=1;
  pc.prog=Math.min(pc.prog,ch.goal);
  if(before<ch.goal&&pc.prog>=ch.goal&&isActive('game'))popup('CHALLENGE DONE!','#4fe08f',true,cell*ROWS/2);
  saveProfile();
}

function play(e,kf,opt){const a=e.animate(kf,Object.assign({fill:'forwards'},opt));a.onfinish=()=>e.remove();return a}

const FLOWER_COLORS=['#ff7eb6','#ffd36b','#ff9d6e','#c79bff','#7fdcff','#8ef5b0'];

const sparkSvg=c=>`<svg viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12 16 13 13 16 12 24 11 16 8 13 0 12 8 11 11 8 12 0Z" fill="${c}"/></svg>`;
const heartSvg=c=>`<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11Z" fill="${c}" stroke="#fff8" stroke-width="1.5"/></svg>`;
function shards(x,y,cols,n){

    const a=R(0,Math.PI*2),d=R(cell*.6,cell*1.7),dx=Math.cos(a)*d,dy=Math.sin(a)*d,rot=R(-540,540);
    play(e,[{transform:'translate(0,0) scale(1.2)',opacity:1},{transform:`translate(${dx*.8}px,${dy*.8-20}px) rotate(${rot*.6}deg) scale(1)`,opacity:1,offset:.5},{transform:`translate(${dx}px,${dy+cell*.8}px) rotate(${rot}deg) scale(.2)`,opacity:0}],{duration:R(650,950),easing:'cubic-bezier(.15,.8,.35,1)'});

  play(e,[{transform:'translate(0,0) scale(0) rotate(0)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(1.1) rotate(180deg)`,opacity:1,offset:.4},{transform:`translate(${dx*1.1}px,${dy-cell}px) scale(.8) rotate(400deg)`,opacity:0}],{duration:R(1100,1500),easing:'cubic-bezier(.2,.9,.3,1)'})}}
function sparkles(x,y){for(let i=0;i<9;i++){const s=R(14,28),e=fxEl('',x+R(-cell,cell),y+R(-cell,cell*.6),s,s,sparkSvg(['#fff','#ffe680','#9ce7ff'][i%3]));

function fireballs(x,y){for(let i=0;i<12;i++){const s=R(18,36),e=fxEl('',x,y,s,s,'<svg viewBox="0 0 64 64"><use href="#i-fire"/></svg>');const a=R(0,Math.PI*2),d=R(cell*.8,cell*2);

function dust(b){const {x,y}=center(b);for(let s of[-1,1])for(let i=0;i<3;i++){const z=R(6,12),e=fxEl('wave',x+s*cell*.3,y+cell*.42,z,z);e.style.background='#ffffffaa';

const floatPts=(b,t,big)=>{const {x,y}=center(b);floatTxt(x,y-cell*.3,t,big)};
function burstPts(n,r1,r2){let p=[];for(let i=0;i<n*2;i++){const a=i*Math.PI/n,r=i%2?r2:r1;p.push((50+Math.cos(a)*r).toFixed(1)+','+(50+Math.sin(a)*r).toFixed(1))}return p.join(' ')}

function spawn(){
  if(G.maxV>=64&&!G.tut){const r=Math.random();if(r<.035)return{v:2,t:'bomb'};if(r<.07)return{v:2,t:'rainbow'}}
  const k=Math.max(3,Math.min(6,Math.floor(Math.log2(G.maxV))-2));
  const ws=[];let tot=0;for(let e=1;e<=k;e++){const w=Math.pow(k-e+1,1.6);ws.push(w);tot+=w}
  let x=Math.random()*tot;for(let e=1;e<=k;e++){x-=ws[e-1];if(x<=0)return{v:2**e}}return{v:2};

}
function tweenScore(){
  if(scoreAnim)cancelAnimationFrame(scoreAnim);
  const from=shownScore,to=G.score,t0=performance.now();
  const step=t=>{const k=Math.min(1,(t-t0)/350);shownScore=Math.round(from+(to-from)*k);$('#gScore').textContent=shownScore.toLocaleString();if(k<1)scoreAnim=requestAnimationFrame(step)};
  scoreAnim=requestAnimationFrame(step);
  $('#gScore').animate([{transform:'scale(1.3)',color:'#ffd86b'},{transform:'scale(1)',color:'#fff'}],{duration:350});
}
function chooseMode(){
  if(!profile.tutDone)return startGame('classic');
  showModal(`<h2>Choose mode</h2><div class="modes">
    <div class="mode" data-mode="classic">${ic('blocks',48)}<div><b>Classic</b><small>Play until the board is full. Best score: ${profile.best.toLocaleString()}</small></div></div>
    <div class="mode" data-mode="time">${ic('timer',48)}<div><b>Time Attack</b><small>2 minutes. Combos add time! Best: ${profile.bestTime.toLocaleString()}</small></div></div></div>`,[{t:'Close',cls:'ghost'}]);
  document.querySelectorAll('.mode').forEach(m=>m.onclick=()=>{Snd.click();hideModal();startGame(m.dataset.mode)});
}
function startGame(mode){
  hideModal(); checkWeek(); mode=mode||(G&&G.mode)||'classic';
  if(pendingResult){show('home');renderHome();showPending();return}
  document.querySelectorAll('#board .blk').forEach(e=>e.remove()); $('#fx').innerHTML='';
  G={grid:Array.from({length:COLS},()=>Array(ROWS).fill(null)),score:0,busy:false,over:false,hammer:false,continued:false,maxV:2,startPts:league.points,mode,timeLeft:TIME_MODE_MS,undo:null,tut:null};
  shownScore=0;
  profile.stats.games++;if(mode==='time')profile.stats.gamesTime++;saveProfile();track('game');
  $('#timer').style.display=mode==='time'?'block':'none';
  $('#modeTag').innerHTML=mode==='time'?ic('timer',16)+'TIME':ic('blocks',16)+'CLASSIC';
  show('game'); layout(); setHammer(false);
  if(!profile.tutDone){
    addBlock(1,0,2);addBlock(3,0,4);G.cur={v:2};G.next={v:8};lastCol=2;G.tut={step:0,col:2};renderTut();
  }else{G.cur=spawn();G.next=spawn()}
  updHud(true); updGhost();
}
function renderTut(){
  const T=$('#tut');T.style.display=G&&G.tut?'block':'none';if(!G||!G.tut)return;
  if(G.tut.step===0){
    const x=G.tut.col*cell+cell/2,y=(ROWS-1)*cell+cell/2;
    T.innerHTML=`<div class="bubble">Tap this column to drop your <b>2</b> next to the other <b>2</b></div><div class="arrow" style="left:${x}px;top:${y-cell*1.7}px">${ic('down',40)}</div><div class="tap" style="left:${x}px;top:${y}px"></div>`;
  }else{
    T.innerHTML=`<div class="bubble">${ic('fire',22)} <b>COMBO!</b> 2+2 made 4, then 4+4 made 8.<br>Chains give ×2, ×3 points. Don't let a column fill up!<button class="btn green" id="tutOk">Let's play!</button></div>`;
    $('#tutOk').onclick=()=>{Snd.click();G.tut=null;profile.tutDone=true;saveProfile();renderTut();updHud(true)};
  }
}
function updHud(previews){
  if(!G)return;
  $('#gScore').textContent=shownScore.toLocaleString(); $('#gBest').textContent=(G.mode==='time'?profile.bestTime:profile.best).toLocaleString();
  $('#gTier').innerHTML=ic('tier'+league.tier,13)+' '+TIERS[league.tier].toUpperCase();
  $('#gRank').textContent='#'+myRank();
  if(previews){setPreview('#curSlot',G.cur,66);setPreview('#nextSlot',G.next,46)}
  $('#hamBtn').innerHTML=ic('hammer',28)+'Hammer<span class="cnt">'+profile.hammers+'</span>';
  $('#swapBtn').innerHTML=ic('swap',28)+'Swap<span class="cnt">'+profile.swaps+'</span>';
  $('#undoBtn').innerHTML=ic('undo',28)+'Undo<span class="cnt">'+profile.undos+'</span>';
}
function addPts(b,chain){
  const pts=b.v*Math.max(1,chain);
  G.score+=pts; league.points+=pts; saveLeague();
  bumpBest();
  floatPts(b,'+'+pts.toLocaleString(),chain>=2); tweenScore(); updHud();
}
function bumpBest(){if(G.mode==='time'){if(G.score>profile.bestTime)profile.bestTime=G.score}else if(G.score>profile.best)profile.best=G.score;saveProfile()}
function checkRecord(b){
  track('block',b.v);
  if(b.v<=profile.bestBlock)return;
  profile.bestBlock=b.v; saveProfile();
  if(b.v>=128){G.score+=b.v;league.points+=b.v;saveLeague();bumpBest();tweenScore();updHud();
    setTimeout(()=>{const {x,y}=center(b);confetti(x,y,40);queuePopup('NEW RECORD!','#ff5fa2',true,cell*1.6);floatPts(b,'BONUS +'+b.v,true)},400)}
}
function canPlace(){if(G.cur.t)return true;for(let c=0;c<COLS;c++){const h=height(c);if(h<ROWS||G.grid[c][ROWS-1].v===G.cur.v)return true}return false}
function advance(){G.cur=G.next;G.next=spawn();updHud(true)}
function snapshot(){G.undo={cells:G.grid.map(col=>col.map(b=>b?b.v:0)),cur:{...G.cur},next:{...G.next},score:G.score,lp:league.points,maxV:G.maxV}}
function onMerged(b,chain){
  profile.stats.merges++;track('merge');
  if(chain>profile.stats.maxCombo)profile.stats.maxCombo=chain;
  if(chain>=2)track('combo',chain);
  if(G.mode==='time'&&chain>=2){G.timeLeft=Math.min(TIME_MODE_MS,G.timeLeft+2000);const {x,y}=center(b);floatTxt(x,y+cell*.4,'+2s',false,'#4fe08f')}
}

async function drop(c){
  if(!G||G.busy||G.over)return;
  if(G.tut){if(G.tut.step!==0||c!==G.tut.col){Snd.error();return}}
  lastCol=c;
  const h=height(c),cur=G.cur;
  if(h>=ROWS){
    const top=G.grid[c][ROWS-1];
    if(cur.t==='bomb'){snapshot();G.busy=true;advance();await explode(top.c,top.r,null);G.busy=false;endTurn();return}
    if(cur.t==='rainbow'||top.v===cur.v){
      snapshot();G.busy=true;advance();const oldS=shapeOf(lvl(top.v));top.v*=2;styleBlock(top.el,top.v);
      G.maxV=Math.max(G.maxV,top.v);onMerged(top,1);mergeFx(top,1,oldS!==shapeOf(lvl(top.v)));addPts(top,1);checkRecord(top);
      await sleep(220);await resolve([top],1);G.busy=false;endTurn();return;
    }
    $('#stage').animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:260});vib('error');Snd.error();return;
  }
  snapshot();G.busy=true; $('#ghost').style.opacity=0; Snd.drop();
  const b={v:cur.v,t:cur.t||null,c,r:h,id:++uid}; advance(); G.grid[c][h]=b;
  b.el=blockEl(b.v,b.t); $('#board').appendChild(b.el);
  b.el.style.transition='none'; b.el.style.transform=`translate(${c*cell+3}px,${-cell}px)`; void b.el.offsetWidth;
  const fall=90+(ROWS-h)*25;
  b.el.style.transition=`transform ${fall}ms cubic-bezier(.55,0,1,.45)`; place(b);
  await sleep(fall);
  b.el.style.transition='';
  b.el.querySelector('.in').animate([{transform:'scale(1,1)'},{transform:'translateY(4px) scale(1.18,.78)'},{transform:'translateY(-3px) scale(.93,1.08)'},{transform:'scale(1,1)'}],{duration:260,easing:'ease-out'});
  dust(b); vib('light'); Snd.land();
  await sleep(110);
  if(b.t==='bomb'){await explode(b.c,b.r,b)}
  else{
    if(b.t==='rainbow'){
      const nb=neigh4(b);b.t=null;b.v=nb.length?Math.max(...nb.map(x=>x.v)):2;
      styleBlock(b.el,b.v);Snd.rainbow();const {x,y}=center(b);sparkles(x,y);shockwave(x,y,'#ffffff');morph(b,'spin');await sleep(260);
    }
    await resolve([b],0);
  }
  G.busy=false; endTurn();
  if(G&&G.tut&&G.tut.step===0){G.tut.step=1;renderTut()}
}
async function explode(c,r,bomb){
  const {x,y}=center({c,r});
  Snd.bomb();vib('heavy');shake(13);boardFlash('#ff9a3c');
  shockwave(x,y,'#ff9a3c',cell*1.5);shockwave(x,y,'#ffd86b');fireballs(x,y);shards(x,y,['#2a2a3e','#ff9a3c','#ffd86b','#fff'],30);
  let pts=0;const vict=[];
  for(let dc=-1;dc<=1;dc++)for(let dr=-1;dr<=1;dr++){const cc=c+dc,rr=r+dr;if(cc<0||cc>=COLS||rr<0||rr>=ROWS)continue;const v=G.grid[cc][rr];if(v&&v!==bomb)vict.push(v)}
  vict.forEach(v=>{pts+=v.v;G.grid[v.c][v.r]=null;const p=center(v);shards(p.x,p.y,[...colorsOf(lvl(v.v)),'#fff'],6);
    v.el.querySelector('.in').animate([{transform:'scale(1) rotate(0)',opacity:1},{transform:`scale(1.4) rotate(${R(-60,60)}deg)`,opacity:0}],{duration:260,fill:'forwards'})});
  if(bomb){G.grid[bomb.c][bomb.r]=null;bomb.el.querySelector('.in').animate([{transform:'scale(1)',opacity:1},{transform:'scale(2.2)',opacity:0}],{duration:240,fill:'forwards'})}
  await sleep(270);vict.forEach(v=>v.el.remove());if(bomb)bomb.el.remove();
  profile.stats.bombs++;saveProfile();track('bomb');
  queuePopup('BOOM!','#ff7b3c',true,Math.max(70,Math.min(y,cell*ROWS-70)));
  if(pts){G.score+=pts;league.points+=pts;saveLeague();bumpBest();floatTxt(x,y,'+'+pts.toLocaleString(),true);tweenScore();updHud()}
  const moved=gravity();if(moved.length)await sleep(180);await resolve(moved,0);
}
async function resolve(start,chain){
  let q=[...start];
  while(q.length){
    const b=q.shift(); if(!alive(b))continue;
    const nb=neigh4(b).filter(x=>x.v===b.v&&!x.t);
    if(!nb.length)continue;
    chain++;
    b.el.style.zIndex=3;
    nb.forEach(x=>{x.el.style.zIndex=2;x.el.style.transition='transform .17s cubic-bezier(.6,0,.9,.6),opacity .17s';x.el.style.transform=b.el.style.transform;
      x.el.querySelector('.in').animate([{transform:'scale(1) rotate(0)'},{transform:'scale(.55) rotate(140deg)'}],{duration:170,fill:'forwards'})});
    b.el.querySelector('.in').animate([{transform:'scale(1)'},{transform:'scale(.85)'}],{duration:170,fill:'forwards'});
    await sleep(170);
    nb.forEach(rm);
    const oldS=shapeOf(lvl(b.v));
    b.v*=2**nb.length; styleBlock(b.el,b.v); G.maxV=Math.max(G.maxV,b.v); vib(chain>=2?'medium':'light');
    b.el.querySelector('.in').getAnimations().forEach(a=>a.cancel());
    onMerged(b,chain);
    mergeFx(b,chain,oldS!==shapeOf(lvl(b.v)));
    addPts(b,chain); checkRecord(b);
    await sleep(240);
    const moved=gravity(); if(moved.length)await sleep(180);
    const seen=new Set(); q=[b,...moved,...q].filter(x=>!seen.has(x.id)&&seen.add(x.id));
  }
}
function gravity(){
  const moved=[];
  for(let c=0;c<COLS;c++){let w=0;for(let r=0;r<ROWS;r++){const x=G.grid[c][r];if(x){if(r!==w){G.grid[c][w]=x;G.grid[c][r]=null;x.r=w;place(x);moved.push(x)}w++}}}
  return moved;
}
function endTurn(){if(!G)return;updHud();updGhost();if(!canPlace())gameOver()}
function doUndo(){
  if(!G||G.busy||G.over||G.tut)return;
  if(profile.undos<=0){buyPower('undos','Undos','undo');return}
  const u=G.undo;if(!u){Snd.error();toast('Nothing to undo yet');return}
  document.querySelectorAll('#board .blk').forEach(e=>e.remove());
  G.grid=Array.from({length:COLS},()=>Array(ROWS).fill(null));
  u.cells.forEach((col,c)=>col.forEach((v,r)=>{if(v)addBlock(c,r,v)}));
  G.cur=u.cur;G.next=u.next;G.score=u.score;league.points=u.lp;G.maxV=u.maxV;saveLeague();G.undo=null;
  profile.undos--;saveProfile();Snd.whoosh();
  allBlocks().forEach(b=>b.el.querySelector('.in').animate([{transform:'scale(.7)',opacity:.3},{transform:'scale(1)',opacity:1}],{duration:250}));
  tweenScore();updHud(true);updGhost();
}
async function gameOver(reason){
  if(G.over)return;
  G.over=true; vib('over'); Snd.over(); updGhost();
  allBlocks().forEach((b,i)=>b.el.querySelector('.in').animate([{filter:'none'},{filter:'grayscale(.8) brightness(.7)'}],{duration:400,delay:i*15,fill:'forwards'}));
  if(reason==='time')popup("TIME'S UP!",'#ff5f7e',true,cell*ROWS/2);
  await sleep(reason==='time'?1200:700);
  if(!G||!G.over)return;
  await Ads.inter();
  showGameOver();
}
function showGameOver(){
  const earned=league.points-G.startPts, rank=myRank(), coins=Math.floor(G.score/50);
  if(!G.coinsGiven){G.coinsGiven=coins;profile.coins+=coins;profile.stats.totalScore+=G.score;saveProfile();
    track(G.mode==='time'?'timescore':'gamescore',G.score)}
  const best=G.mode==='time'?profile.bestTime:profile.best;
  const btns=[];
  if(!G.continued&&G.mode==='classic')btns.push({t:'Watch ad to continue',ic:'tv',icS:30,cls:'gold',fn:continueGame});
  if(coins>0&&!G.doubled)btns.push({t:`Double coins (+${coins})`,ic:'coin',icS:26,cls:'gold',fn:()=>Ads.reward(()=>{G.doubled=true;profile.coins+=coins;saveProfile();Snd.coin();showGameOver()})});
  btns.push({t:'Play again',ic:'replay',cls:'green',fn:()=>startGame(G.mode)},{t:'Share score',ic:'share',fn:()=>{shareText(`I scored ${G.score.toLocaleString()} in Block Merge 2048${G.maxV>=512?' and made a '+fmt(G.maxV)+' block':''}! Can you beat me?`);setTimeout(showGameOver,300)}},{t:'Home',ic:'home',cls:'ghost',fn:goHome});
  showModal(`<h2>${G.mode==='time'?"Time's up!":'Game Over'}</h2><div class="go-score">${G.score.toLocaleString()}</div><p>${ic('star',20)} Best: ${best.toLocaleString()} · ${ic('coin',20)} +${coins+(G.doubled?coins:0)}</p>
    <div class="go-league">${tierIc(league.tier,28)} ${TIERS[league.tier]} League<br>+${earned.toLocaleString()} league points<br>Your rank: <b>#${rank}</b> of ${GROUP}</div>`,btns);
}
function continueGame(){
  Ads.reward(()=>{
    G.continued=true; G.over=false;
    allBlocks().forEach(b=>b.el.querySelector('.in').getAnimations().forEach(a=>a.cancel()));
    allBlocks().filter(x=>x.r>=ROWS-3).forEach(x=>{const {x:px,y:py}=center(x);G.grid[x.c][x.r]=null;shards(px,py,[...colorsOf(lvl(x.v)),'#fff'],8);
      x.el.querySelector('.in').animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.5)',opacity:0}],{duration:250,fill:'forwards'});setTimeout(()=>x.el.remove(),260)});
    Snd.blast(true);popup('CLEARED!','#4fe08f',true,cell*2); G.undo=null; updHud(); updGhost();
    if(!canPlace())gameOver();
  });
}
function goHome(){hideModal();G=null;$('#tut').style.display='none';checkWeek();show('home');renderHome();showPending()}
function pauseMenu(){
  if(!G||G.over)return;
  showModal(`<h2>Paused</h2><p>Your points are already saved to the League.</p>`,[{t:'Resume',ic:'play',cls:'green'},{t:'New game',ic:'replay',fn:()=>startGame(G.mode)},{t:'Settings',ic:'gear',fn:openSettings},{t:'Home',ic:'home',cls:'ghost',fn:goHome}]);
}
function setHammer(on){if(G)G.hammer=on;$('#board').classList.toggle('hammer',on);$('#hamBtn').classList.toggle('on',on);updGhost()}
function buyPower(key,label,icon){
  showModal(`${ic(icon,64,'margin:0 auto 4px;display:block')}<h2>Out of ${label}</h2><p>Get one more:</p><p>${ic('coin',22)} Your coins: ${profile.coins.toLocaleString()}</p>`,[
    {t:'Watch ad: +1 free',ic:'tv',icS:30,cls:'gold',fn:()=>Ads.reward(()=>{profile[key]++;saveProfile();Snd.coin();updHud()})},
    {t:'+1 for 100 coins',ic:'coin',icS:26,fn:()=>{if(profile.coins>=100){profile.coins-=100;profile[key]++;saveProfile();Snd.coin();updHud()}else{Snd.error();toast(ic('coin',18)+' Not enough coins')}}},
    {t:'Close',ic:'close',cls:'ghost'}]);
}
function gameLoop(t){
  const dt=rafT?Math.min(100,t-rafT):0;rafT=t;
  if(G&&G.mode==='time'&&!G.over&&!G.tut&&isActive('game')&&!modalOpen()&&!document.hidden){
    G.timeLeft-=dt;
    const f=Math.max(0,G.timeLeft/TIME_MODE_MS);$('#timerFill').style.width=(f*100)+'%';
    const s=Math.ceil(Math.max(0,G.timeLeft)/1000);$('#timerTxt').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    if(G.timeLeft<=10000&&Math.floor(G.timeLeft/1000)!==Math.floor((G.timeLeft+dt)/1000))Snd.tick();
    if(G.timeLeft<=0&&!G.busy)gameOver('time');
  }
  requestAnimationFrame(gameLoop);
}

   INIT
   ========================================================= */
(function(){
  const cols=$('#cols'); for(let i=0;i<COLS;i++)cols.appendChild(document.createElement('div'));

  for(let i=0;i<10;i++){const e=document.createElement('i');const s=R(24,60);e.style.cssText=`left:${R(0,95)}%;width:${s}px;height:${s}px;background:${bc[i%6]};animation-duration:${R(14,28)}s;animation-delay:${-R(0,28)}s`;bg.appendChild(e)}

  tap($('#qShop'),()=>openPanel('shop')); tap($('#qStats'),()=>openPanel('stats'));
  tap($('#pBack'),goHome);

  tap($('#menuBtn'),pauseMenu);

  $('#swapBtn').onclick=()=>{if(!G||G.busy||G.over||G.tut)return;if(profile.swaps<=0){Snd.click();buyPower('swaps','Swaps','swap');return}[G.cur,G.next]=[G.next,G.cur];profile.swaps--;saveProfile();Snd.whoosh();updHud(true);updGhost();if(!canPlace())gameOver()};
  $('#undoBtn').onclick=()=>{Snd.click();doUndo()};
  const board=$('#board');
  board.addEventListener('pointermove',e=>{if(!G||G.busy||G.tut)return;const rc=board.getBoundingClientRect();const c=Math.max(0,Math.min(COLS-1,Math.floor((e.clientX-rc.left)/cell)));if(c!==lastCol){lastCol=c;updGhost()}});
  board.addEventListener('pointerdown',async e=>{
    if(!G||G.busy||G.over)return;
    const rc=board.getBoundingClientRect(), x=e.clientX-rc.left, y=e.clientY-rc.top;
    const c=Math.max(0,Math.min(COLS-1,Math.floor(x/cell)));
    if(G.hammer){
      const r=ROWS-1-Math.floor(y/cell), b=r>=0&&r<ROWS?G.grid[c][r]:null; if(!b)return;
      snapshot();G.busy=true; setHammer(false); profile.hammers--; profile.stats.hammersUsed++; saveProfile(); updHud();
      const {x:px,y:py}=center(b),[c1,c2]=colorsOf(lvl(b.v));
      const hm=fxEl('',px+cell*.5,py-cell*.6,cell*.9,cell*.9,`<svg viewBox="0 0 64 64"><use href="#i-hammer"/></svg>`);

      await sleep(210); shake(8); shockwave(px,py,c1); shards(px,py,[c1,c2,'#fff'],22); vib('heavy'); Snd.hammer();
      b.el.querySelector('.in').animate([{transform:'scale(1)',opacity:1},{transform:'scale(1.4) rotate(20deg)',opacity:0}],{duration:200,fill:'forwards'});
      await sleep(200); rm(b);
      const moved=gravity(); if(moved.length)await sleep(180); await resolve(moved,0);
      G.busy=false; endTurn(); return;
    }
    drop(c);
  });
  window.addEventListener('resize',layout);
  if(CapApp){try{CapApp.addListener('backButton',()=>{
    if(modalOpen()){if(!spinning)hideModal();return}
    if(isActive('game')){if(G&&!G.over)pauseMenu();else goHome();return}
    if(isActive('league')&&G&&!G.over){show('game');return}
    if(!isActive('home')){goHome();return}
    CapApp.exitApp();
  })}catch(e){}}
  setInterval(()=>{
    if(isActive('game'))return;
    checkWeek();

  requestAnimationFrame(gameLoop);
  checkWeek(); applyLook(); layout(); renderHome(); Ads.init(); Notif.schedule();
  if(!profile.name)askName(()=>{showPending();if(!profile.tutDone)setTimeout(()=>startGame('classic'),200)});
  else startupPopups();
})();
